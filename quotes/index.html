<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>金句墙 · 银幕金句</title>
  <meta name="description" content="银幕金句列表 · Top124 封面卡可点进详情">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-base="../">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="../">银幕金句 <span>Silver Lines</span></a>
      <nav>
        <ul class="nav">
          <li><a href="../">首页</a></li>
          <li><a href="./" aria-current="page">金句</a></li>
          <li><a href="../about/">关于</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <h1>金句墙</h1>
        <p>M7 Top124 · 列表最多展示豆瓣 + IMDb 两枚评分徽章；点击封面卡进入详情。</p>
      </div>
      <div id="quote-list" class="quote-grid" aria-live="polite">
        <p class="error-msg">加载中…</p>
      </div>
      <p class="placeholder-note">M7 · 124 条 published · 评分截至见详情 · 静帧示意非原片截帧</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>银幕金句 / Silver Lines · 无播放器 · 图片相对路径本地示意 PNG</p>
    </div>
  </footer>

  <script src="../assets/js/ratings.js"></script>
  <script src="../assets/js/site.js"></script>
  <script>
    (async function () {
      const el = document.getElementById("quote-list");
      try {
        const quotes = SilverSite.publishedQuotes(await SilverSite.loadQuotes());
        if (!quotes.length) {
          el.innerHTML = '<p class="error-msg">暂无金句。</p>';
          return;
        }
        el.innerHTML = quotes.map(SilverSite.cardHtml).join("");
      } catch (e) {
        el.innerHTML = '<p class="error-msg">无法加载 quotes.json。请从站点根目录启动 python3 -m http.server。</p>';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
