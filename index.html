<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>片语 · Silver Lines</title>
  <meta name="description" content="片语 Silver Lines · 光影说过的好句子。收录电影里值得记住的台词——电影只是出处，句子本身才是主角。">
  <link rel="preconnect" href="https://fonts.loli.net">
  <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
  <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-base="">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="./">片语 <span>Silver Lines</span></a>
      <nav>
        <ul class="nav">
          <li><a href="./" aria-current="page">首页</a></li>
          <li><a href="quotes/">片语</a></li>
          <li><a href="about/">关于</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero container">
      <p class="hero__eyebrow">Silver Lines</p>
      <h1 class="hero__title">光影说过的好句子</h1>
      <p class="hero__sub">这里收录电影里值得记住的台词。电影只是出处，句子本身才是主角。</p>
      <div class="hero__actions">
        <a class="hero__cta" href="quotes/">进入片语集
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h13M13 6.5L18.5 12 13 17.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button type="button" class="btn-ghost" id="btn-random">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="15" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="15" r="1.4" fill="currentColor"/><circle cx="15" cy="15" r="1.4" fill="currentColor"/></svg>
          随机来一句</button>
      </div>
    </section>

    <section class="container">
      <div id="daily" aria-live="polite">
        <p class="error-msg">加载中…</p>
      </div>
      <div class="stats" id="stats" aria-live="polite"></div>
    </section>

    <section class="container" style="margin-top:3rem">
      <h2 class="section-title">精选片语</h2>
      <div id="featured" class="quote-grid" aria-live="polite">
        <p class="error-msg">加载中…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>片语 / Silver Lines · 电影只是出处，句子本身才是主角</p>
      <p>© 详见 <a href="about/">关于</a> 与 README</p>
    </div>
  </footer>

  <script src="assets/js/ratings.js"></script>
  <script src="assets/js/site.js"></script>
  <script>
    (async function () {
      const dailyEl = document.getElementById("daily");
      const featEl = document.getElementById("featured");
      const statsEl = document.getElementById("stats");
      const btnRandom = document.getElementById("btn-random");

      function renderDailyCard(q, label) {
        if (!q) { dailyEl.innerHTML = ""; return; }
        const d = new Date();
        const dateStr = d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
        const en = SilverSite.lineEnOf(q);
        dailyEl.innerHTML =
          '<div class="daily-card"><a class="daily-card__inner" href="' + SilverSite.quoteDetailHref(q.id) + '">' +
          '<div class="daily-card__head"><span class="daily-card__label">' + label + "</span>" +
          '<span class="daily-card__date">' + dateStr + "</span></div>" +
          '<div class="daily-card__body"><div class="daily-card__text">' +
          '<p class="daily-card__quote">' + SilverSite.escapeHtml(SilverSite.lineOf(q)) + "</p>" +
          (en ? '<p class="daily-card__en">' + SilverSite.escapeHtml(en) + "</p>" : "") +
          '<p class="daily-card__meta"><strong>' + SilverSite.escapeHtml(SilverSite.filmTitleOf(q)) +
          "</strong> · " + q.year + "</p></div>" +
          '<div class="daily-card__still"><img src="' + SilverSite.asset(q.still) +
          '" alt="' + SilverSite.escapeAttr(SilverSite.filmTitleOf(q)) + ' 剧照氛围示意"></div>' +
          "</div></a></div>";
      }

      try {
        const quotes = await SilverSite.loadQuotes();
        const pub = SilverSite.publishedQuotes(quotes);

        renderDailyCard(SilverSite.dailyQuote(quotes), "今日一句");

        /* 统计带 */
        const s = SilverSite.statsOf(quotes);
        statsEl.innerHTML =
          '<div class="stats__item"><p class="stats__num">' + s.count + '</p><p class="stats__label">收录句子</p></div>' +
          '<div class="stats__item"><p class="stats__num">' + s.films + '</p><p class="stats__label">出自影片</p></div>' +
          '<div class="stats__item"><p class="stats__num">' + s.tags + '</p><p class="stats__label">标签</p></div>';

        /* 精选 */
        featEl.innerHTML = SilverSite.featuredQuotes(quotes, 5).map(SilverSite.cardHtml).join("");

        /* 随机来一句：就地替换今日一句卡片 */
        btnRandom.addEventListener("click", function () {
          const r = SilverSite.randomQuote(quotes);
          if (r) renderDailyCard(r, "随机一句");
        });
      } catch (e) {
        dailyEl.innerHTML = '<p class="error-msg">无法加载数据。请用本地服务器打开站点根目录（见 README）。</p>';
        featEl.innerHTML = "";
        console.error(e);
      }
    })();
  </script>
</body>
</html>
